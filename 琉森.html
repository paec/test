  <style>
    :root{--navy:#073763;--blue:#075fae;--teal:#078577;--ink:#10243e;--muted:#607184;--bg:#edf5f8;--card:#fff;--line:#d7e5ed;--soft:#f5fafc;--amber:#d97706;--red:#ba3b46;--shadow:0 10px 30px rgba(17,54,76,.12);--radius:20px;--safe:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;color:var(--ink);background:linear-gradient(180deg,#e7f3f7 0,#f7fafb 36rem);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.65} img{display:block;max-width:100%} button,a{font:inherit} a{color:inherit}.wrap{width:min(1080px,calc(100% - 28px));margin:auto}
    .hero{min-height:440px;color:#fff;background:linear-gradient(112deg,rgba(3,39,78,.96),rgba(5,123,139,.76)),url('https://images.unsplash.com/photo-1527668752968-14dc70a27c95?auto=format&fit=crop&w=1800&q=85') center/cover;display:flex;align-items:end;padding:78px 0 62px}.eyebrow{display:inline-flex;gap:8px;align-items:center;padding:7px 12px;border:1px solid #ffffff55;border-radius:999px;background:#ffffff18;backdrop-filter:blur(8px);font-size:.88rem;font-weight:700}.hero h1{font-size:clamp(2.7rem,8vw,5.6rem);line-height:1;margin:18px 0 14px;letter-spacing:-.04em}.hero p{max-width:720px;margin:0;color:#e5f6fa;font-size:clamp(1rem,2.4vw,1.22rem)}.hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.pill{padding:8px 12px;background:#ffffff18;border:1px solid #ffffff35;border-radius:12px;font-size:.9rem}
    .sticky-tabs{position:sticky;top:0;z-index:20;background:#ffffffee;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.tabs{display:flex;gap:6px;overflow:auto;padding:10px 0;scrollbar-width:none}.tab{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:10px 14px;border-radius:12px;font-weight:750;cursor:pointer}.tab.active{color:#fff;background:var(--navy);box-shadow:0 6px 18px #07376335}.main{padding:28px 0 calc(105px + var(--safe))}.plan{display:none;animation:rise .35s ease}.plan.active{display:block}@keyframes rise{from{opacity:0;transform:translateY(8px)}}
    .intro,.section-card,.notice{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.intro{padding:24px;margin-bottom:18px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}.kicker{color:var(--teal);font-size:.83rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.intro h2,.section-title{margin:4px 0 5px;line-height:1.2}.intro p{margin:0;color:var(--muted)}.metric{min-width:128px;text-align:center;background:#edf8f6;border-radius:16px;padding:14px}.metric strong{display:block;font-size:1.45rem;color:var(--teal)}
    .route{display:grid;gap:12px}.stop{display:grid;grid-template-columns:54px 140px 1fr auto;gap:14px;align-items:start;padding:16px 17px;background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:0 5px 20px rgba(17,54,76,.07)}.stop-image{width:140px;height:90px;object-fit:cover;border-radius:12px;background:#e7eef2}.num{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--navy),var(--blue));color:#fff;font-weight:850}.stop h3{font-size:1rem;margin:0 0 3px}.stop p{color:var(--muted);font-size:.91rem;margin:0}.tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:#fff3d8;color:#9a5a00;font-size:.72rem;font-weight:800;vertical-align:2px}.map{display:inline-flex;gap:5px;align-items:center;text-decoration:none;color:var(--blue);font-size:.85rem;font-weight:800;padding:7px 9px;border-radius:10px;background:#eef7ff}.arrow{height:12px;margin-left:26px;border-left:2px dashed #96b7c7}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.section-card{padding:21px}.section-card h3{margin:0 0 10px}.bullets{margin:0;padding-left:20px}.bullets li+li{margin-top:8px}.notice{padding:17px 19px;margin:16px 0;border-left:5px solid var(--amber);box-shadow:none;background:#fffaf0}.notice strong{color:#955706}.timetable{width:100%;border-collapse:separate;border-spacing:0;margin-top:12px;overflow:hidden;border:1px solid var(--line);border-radius:14px}.timetable th,.timetable td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line)}.timetable tr:last-child td{border:0}.timetable th{background:#edf7fa}.time{font-weight:850;color:var(--navy)}
    .photo-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:12px;margin-top:16px}.photo{min-height:240px;border-radius:18px;overflow:hidden;position:relative;background:#b9d2dc}.photo img{width:100%;height:100%;object-fit:cover;position:absolute}.photo span{position:absolute;left:12px;bottom:12px;color:#fff;background:#062f49c9;border:1px solid #ffffff40;border-radius:10px;padding:6px 9px;font-size:.8rem;font-weight:750}.section-card>.photo{min-height:180px;margin:-21px -21px 16px;border-radius:var(--radius) var(--radius) 0 0}.checklist{display:grid;gap:10px}.check{display:flex;gap:11px;align-items:flex-start;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--soft);cursor:pointer}.check input{width:20px;height:20px;accent-color:var(--teal);margin-top:2px}.check:has(input:checked){opacity:.58;text-decoration:line-through}.links{display:flex;flex-wrap:wrap;gap:9px}.linkbtn{display:inline-flex;text-decoration:none;background:var(--navy);color:#fff;padding:9px 12px;border-radius:11px;font-weight:750;font-size:.88rem}.linkbtn.alt{background:#e8f5f5;color:#086d64}.bottom-nav{position:fixed;right:0;bottom:0;left:0;z-index:30;background:#ffffffed;border-top:1px solid var(--line);backdrop-filter:blur(16px);padding-bottom:var(--safe)}.bottom-tabs{display:flex;justify-content:space-around;max-width:620px;margin:auto;padding:7px}.bottom-tabs .tab{display:grid;gap:1px;place-items:center;font-size:.73rem;padding:6px 10px}.bottom-tabs .icon{font-size:1.2rem}.footer{color:var(--muted);font-size:.8rem;text-align:center;padding:25px 0}
    @media(max-width:700px){.hero{min-height:390px;padding:60px 0 42px}.intro{grid-template-columns:1fr}.metric{text-align:left}.stop{grid-template-columns:92px 1fr;gap:12px}.stop-image{width:92px;height:76px;grid-row:span 2}.stop>.map{grid-column:2}.grid,.photo-grid{grid-template-columns:1fr}.photo{min-height:210px}.section-card>.photo{margin:-17px -17px 16px}.tabs .tab{padding:9px 11px}.section-card{padding:17px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
  </style>

<body>
<header id="top" class="hero"><div class="wrap"><span class="eyebrow">🇨🇭 LUZERN · 瑞士湖光城市</span><h1>琉森</h1><p>從卡貝爾橋與舊城廣場，走上穆塞格城牆，再搭船前往 Meggenhorn 城堡半島；把城市、人文與湖景排進同一趟旅行。</p><div class="hero-meta"><span class="pill">🚶 城市步行</span><span class="pill">⛴️ 湖上交通</span><span class="pill">🏰 城堡花園</span><span class="pill">🌙 夜間散步</span></div></div></header>
<nav class="sticky-tabs"><div class="wrap tabs" id="topTabs"></div></nav>
<main class="wrap main" id="planContainer"></main>
<nav class="bottom-nav"><div class="bottom-tabs" id="bottomTabs"></div></nav>
<script>
const maps=q=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const imageSources={
  '琉森火車站':'',
  '卡貝爾橋 Kapellbrücke':'',
  '天鵝廣場 Schwanenplatz':'',
  '卡貝爾廣場 Kapellplatz':'',
  '舊城廣場群':'',
  '穆塞格城牆 Museggmauer':'',
  'Hertensteinstrasse 購物街':'',
  '垂死獅子像・冰河公園':'',
  '布爾巴基全景館':'',
  '聖萊奧德伽爾教堂':'',
  'Schweizerhofquai 湖畔大道':'',
  '碼頭搭船／改搭公車':'',
  '前往 Meggenhorn 城堡':'',
  '城堡、葡萄園與牧場':'',
  '半島外緣耶穌雕像':'',
  '搭船或公車返回':'',
  '羅伊斯河畔・卡貝爾橋':'',
  'Schweizerhofquai':'',
  '斯普洛耶橋 Spreuerbrücke':'',
  'KKL 琉森文化和會議中心':'',
  '耶穌會教堂':'',
  'Sammlung Rosengart 美術館':'',
  '瑞士交通博物館':'',
  'Weggis':'',
  '瑞吉峰 Rigi':'',
  '湖光與舊城':'https://images.unsplash.com/photo-1502784444187-359ac186c5bb?auto=format&fit=crop&w=1200&q=80',
  '瑞士山湖氛圍':'https://images.unsplash.com/photo-1527668752968-14dc70a27c95?auto=format&fit=crop&w=900&q=80'
};
const travelData={tabs:[
{id:'city',label:'城市經典',icon:'🚶',title:'第一段｜舊城經典步行',subtitle:'從火車站出發，以順路動線串起木橋、廣場、城牆與湖畔。',metric:'半日～1日',stops:[
['琉森火車站','出站後先往羅伊斯河與卡貝爾橋方向。','Luzern Bahnhof'],['卡貝爾橋 Kapellbrücke','琉森地標；可從兩岸取不同角度。','Kapellbrücke Luzern'],['天鵝廣場 Schwanenplatz','湖畔與舊城入口的重要節點。','Schwanenplatz Luzern'],['卡貝爾廣場 Kapellplatz','進入舊城廣場群前的短停點。','Kapellplatz Luzern'],['舊城廣場群','穀物廣場 → 鹿兒廣場 → 葡萄酒廣場 → 磨坊廣場。','Kornmarkt Luzern','磨坊廣場彈性'],['穆塞格城牆 Museggmauer','登高看舊城、湖泊與城市屋頂；留意開放狀況。','Museggmauer Luzern'],['Hertensteinstrasse 購物街','由城牆區往獅子紀念碑方向銜接。','Hertensteinstrasse Luzern'],['垂死獅子像・冰河公園','相鄰景點，可依停留時間選擇深度。','Lion Monument Luzern'],['布爾巴基全景館','鄰近獅子像，適合作為雨備或彈性加點。','Bourbaki Panorama Luzern','彈性'],['聖萊奧德伽爾教堂','雙塔地標，之後可順接湖畔大道。','Hofkirche St. Leodegar','彈性'],['Schweizerhofquai 湖畔大道','湖景、飯店街景與山景兼具。','Schweizerhofquai Luzern'],['返回琉森火車站','沿湖或穿越舊城回到車站。','Luzern Bahnhof'] ]},
{id:'castle',label:'湖畔城堡',icon:'🏰',title:'第二段｜Meggenhorn 城堡花園',subtitle:'搭船最有旅行感；若班次銜接不理想，立即改公車。',metric:'約 3～4 小時'},
{id:'night',label:'晚間漫步',icon:'🌙',title:'夜間｜河畔與燈影',subtitle:'回到市中心後，以低強度路線收尾。',metric:'約 1～1.5 小時'},
{id:'morning',label:'離開前',icon:'☀️',title:'第二天早上｜列車前彈性時間',subtitle:'先反推取行李與進站時間，再挑 1 個主景點。',metric:'擇 1～2 處'},
{id:'more',label:'遺珠備案',icon:'✨',title:'遺珠｜下次或天候替代',subtitle:'適合延長住宿、雨天或想把琉森玩得更深。',metric:'彈性安排'}]};
function stopHTML(s,i){const slot=imageSources[s[0]]||`https://placehold.co/320x180/e7eef2/5d6c7d?text=Lucerne+${i+1}`;return `${i?'<div class="arrow"></div>':''}<article class="stop"><div class="num">${String(i+1).padStart(2,'0')}</div><img class="stop-image" src="${slot}" data-image-slot="${s[0]}" alt="${s[0]} 圖片預留位置" loading="lazy"><div><h3>${s[0]}${s[3]?`<span class="tag">${s[3]}</span>`:''}</h3><p>${s[1]}</p></div><a class="map" target="_blank" rel="noopener" href="${maps(s[2])}">地圖 ↗</a></article>`}
function header(t){return `<section class="intro"><div><div class="kicker">Luzern Travel Plan</div><h2>${t.title}</h2><p>${t.subtitle}</p></div><div class="metric"><strong>${t.metric}</strong><span>建議安排</span></div></section>`}
function photoHTML(name,index){const slot=imageSources[name]||`https://placehold.co/720x420/e7eef2/5d6c7d?text=Lucerne+${index}`;return `<div class="photo"><img loading="lazy" src="${slot}" data-image-slot="${name}" alt="${name} 圖片預留位置"><span>${name}</span></div>`}
function renderPlans(){const el=document.querySelector('#planContainer');el.innerHTML=travelData.tabs.map(t=>{let body='';if(t.id==='city') body=`<div class="route">${t.stops.map(stopHTML).join('')}</div><div class="photo-grid"><div class="photo"><img loading="lazy" src="${imageSources['湖光與舊城']}" alt="琉森湖與城市風景"><span>湖光與舊城</span></div><div class="photo"><img loading="lazy" src="${imageSources['瑞士山湖氛圍']}" alt="瑞士山湖景觀"><span>瑞士山湖氛圍</span></div></div>`;
if(t.id==='castle') body=`<div class="notice"><strong>交通策略：</strong>先看船班；等待過久就改搭公車。船班具季節性，務必以旅行當日 SBB／SGV 為準。</div><div class="route">${[
['琉森火車站','若時間充裕，先看車站旁的 KKL 建築。','Luzern Bahnhof'],['KKL 琉森文化和會議中心','車站旁彈性停留；也可留到隔天早上。','KKL Luzern','彈性'],['碼頭搭船／改搭公車','船行最有景觀感；公車通常更容易掌握時間。','Luzern Bahnhofquai'],['前往 Meggenhorn 城堡','碼頭步道約十多分鐘且爬升約 40–50 公尺；公車站方向多為下坡步行。','Schloss Meggenhorn'],['城堡、葡萄園與牧場','前方葡萄園、後方草地，兼具湖景與田園感。','Schloss Meggenhorn'],['半島外緣耶穌雕像','沿園區步道前往湖畔外緣；依現場指標行走。','Christusstatue Meggenhorn'],['搭船或公車返回','依當下班次選擇，避免為等船壓縮後續行程。','Meggenhorn Schiffstation'],['琉森火車站','回市區後銜接晚餐或夜間漫步。','Luzern Bahnhof']].map(stopHTML).join('')}</div><section class="section-card" style="margin-top:16px"><h3>⛴️ 船班時間參考</h3><table class="timetable"><thead><tr><th>方向</th><th>班次</th></tr></thead><tbody><tr><td>琉森 → Meggenhorn</td><td class="time">13:20 · 14:50 · 16:20</td></tr><tr><td>Meggenhorn → 琉森</td><td class="time">13:58 · 15:28 · 16:58</td></tr></tbody></table><p style="color:var(--muted);font-size:.82rem;margin-bottom:0">以上為行程資料提供之參考時間，可能因日期、季節或航務調整。</p><div class="links" style="margin-top:12px"><a class="linkbtn" target="_blank" href="https://www.sbb.ch/en">查 SBB</a><a class="linkbtn alt" target="_blank" href="https://www.lakelucerne.ch/en/">查 SGV 船班</a><a class="linkbtn alt" target="_blank" href="https://www.meggenhorn.ch/">城堡官網</a></div></section>`;
if(t.id==='night') body=`<div class="grid"><section class="section-card">${photoHTML('羅伊斯河畔・卡貝爾橋','night-1')}<h3>🌉 羅伊斯河畔・卡貝爾橋</h3><p>夜色中的木橋與河岸倒影，是最適合慢走與拍照的一段。</p><a class="map" target="_blank" href="${maps('Kapellbrücke Luzern')}">開啟地圖 ↗</a></section><section class="section-card">${photoHTML('Schweizerhofquai','night-2')}<h3>✨ Schweizerhofquai</h3><p>沿湖可看東方文華、Hotel Schweizerhof 等經典飯店立面與燈光。</p><a class="map" target="_blank" href="${maps('Schweizerhofquai Luzern')}">開啟地圖 ↗</a></section><section class="section-card">${photoHTML('斯普洛耶橋 Spreuerbrücke','night-3')}<h3>🌉 斯普洛耶橋 Spreuerbrücke</h3><p>往西漫步到第二座代表性木橋，再從河岸方向遠眺古奇城堡飯店。</p><a class="map" target="_blank" href="${maps('Spreuerbrücke Luzern')}">開啟地圖 ↗</a></section><section class="section-card"><h3>夜間提醒</h3><ul class="bullets"><li>穿防滑、好走的鞋。</li><li>注意末班交通與取行李時間。</li><li>湖邊夜晚可能較涼，帶薄外套。</li></ul></section></div>`;
if(t.id==='morning') body=`<div class="notice"><strong>倒推法：</strong>列車發車時間 − 取行李 − 步行到月台 − 15 分鐘緩衝，才是最晚離開景點的時間。</div><div class="grid"><section class="section-card">${photoHTML('KKL 琉森文化和會議中心','morning-1')}<h3>KKL 琉森文化和會議中心</h3><p>就在車站旁，最容易控制時間；若前一天未到訪，優先度最高。</p><a class="map" target="_blank" href="${maps('KKL Luzern')}">地圖 ↗</a></section><section class="section-card">${photoHTML('耶穌會教堂','morning-2')}<h3>耶穌會教堂</h3><p>位於羅伊斯河畔，可與卡貝爾橋、車站形成短迴圈。</p><a class="map" target="_blank" href="${maps('Jesuit Church Lucerne')}">地圖 ↗</a></section><section class="section-card">${photoHTML('Sammlung Rosengart 美術館','morning-3')}<h3>Sammlung Rosengart 美術館</h3><p>鄰近車站，館藏包含多件畢卡索作品；入館前先確認當日開館時間。</p><a class="map" target="_blank" href="${maps('Sammlung Rosengart Luzern')}">地圖 ↗</a></section><section class="section-card"><h3>出發前 Checklist</h3><div class="checklist">${['確認列車月台與時間','預留取行李時間','景點離開前回看步行時間','補水、上洗手間'].map((x,i)=>`<label class="check"><input type="checkbox" data-key="m${i}"><span>${x}</span></label>`).join('')}</div></section></div>`;
if(t.id==='more') body=`<div class="grid"><section class="section-card">${photoHTML('瑞士交通博物館','more-1')}<h3>🚆 瑞士交通博物館</h3><p>琉森代表性大型博物館；適合雨天、親子或交通迷。票價與 STP 優惠請依當日規則確認。</p><a class="map" target="_blank" href="${maps('Swiss Museum of Transport')}">地圖 ↗</a></section><section class="section-card">${photoHTML('Weggis','more-2')}<h3>🏘️ Weggis</h3><p>湖畔小鎮，可用船班串聯，適合放慢節奏。</p><a class="map" target="_blank" href="${maps('Weggis Switzerland')}">地圖 ↗</a></section><section class="section-card">${photoHTML('瑞吉峰 Rigi','more-3')}<h3>⛰️ 瑞吉峰 Rigi</h3><p>經典山景行程，可從 Vitznau 或 Arth-Goldau 等方向上山；持 STP 的適用範圍請出發前確認。</p><a class="map" target="_blank" href="${maps('Rigi Kulm')}">地圖 ↗</a></section><section class="section-card"><h3>安排建議</h3><ul class="bullets"><li>下雨：交通博物館。</li><li>晴朗且有整天：瑞吉峰。</li><li>想放空看湖：Weggis。</li></ul></section></div>`;
return `<section class="plan" id="${t.id}">${header(t)}${body}</section>`}).join('');restoreChecks()}
function renderTabs(){const tabs=travelData.tabs.map(t=>`<button class="tab" data-target="${t.id}"><span class="icon">${t.icon}</span><span>${t.label}</span></button>`).join('');topTabs.innerHTML=tabs;bottomTabs.innerHTML=tabs}
function showPlan(id,hash=true){document.querySelectorAll('.plan').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-target]').forEach(x=>x.classList.toggle('active',x.dataset.target===id));if(hash)history.replaceState(null,'','#'+id);scrollTo({top:document.querySelector('.sticky-tabs').offsetTop,behavior:'smooth'})}
function restoreChecks(){document.querySelectorAll('[data-key]').forEach(c=>{c.checked=localStorage.getItem('luzern-'+c.dataset.key)==='1';c.onchange=()=>localStorage.setItem('luzern-'+c.dataset.key,c.checked?'1':'0')})}
renderTabs();renderPlans();document.addEventListener('click',e=>{const b=e.target.closest('[data-target]');if(b)showPlan(b.dataset.target)});const ids=travelData.tabs.map(x=>x.id),start=ids.includes(location.hash.slice(1))?location.hash.slice(1):ids[0];showPlan(start,false);
</script>
</body></html>
